# Observation is the default; --control is a separate explicit option.
# Confirmed mount: fixed at chassis rear, looking DOWN (2026-11-10).
# Pixel axes must not be equated with chassis forward/lateral axes.
image_topic: /camera/color/image_raw
target: null                  # [x, y] pixels; null uses image center
jacobian: null                # REQUIRED measured 2x2 matrix before --control
# J = [[dx/d_forward_m, dx/d_yaw_rad], [dy/d_forward_m, dy/d_yaw_rad]].
# Divide observed pixel displacements by the real measured forward metres or
# yaw radians, holding the other axis still. Use the same camera/feature/depth.
# Do not infer camera signs or scale from the temporary object's dimensions.
gain: 0.5                     # 1/s
tolerance_px: 5.0
frame_timeout_s: 0.25          # BOTH ROS header age and local receipt age
