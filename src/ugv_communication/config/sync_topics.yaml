# FKIE imports matching remote registrations; it does not rename publications.
# The peer must also allow the formal task topics and four /ugv/... interfaces.
sync_topics:
  - /uav/test
  - /air_ground/command
  - /air_ground/state
  - /ugv/odom
  - /ugv/pose
  - /ugv/chassis_ready
  - /ugv/mission/state
# Public contract metadata; FKIE uses sync_topics and does not enforce types or
# latching. The command/state publishers enforce these transport properties.
air_ground_interfaces:
  command: {topic: /air_ground/command, type: slicer_air_ground_msgs/Command, latch: false}
  state: {topic: /air_ground/state, type: std_msgs/String, latch: true}
