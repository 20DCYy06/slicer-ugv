# Sole dynamic map->odom owner. The local LIO/wheel EKF remains unchanged.
frequency: 20
sensor_timeout: 0.5
two_d_mode: true
publish_tf: true
# Publish the estimated state at the update time, so map->odom covers the
# newer local robot-pose epoch used by DWA. Measurement stamps stay unchanged.
predict_to_current_time: true
# Cover asynchronous 20 Hz local/global TF publication (field residual <=35 ms).
# This dates only map->odom TF by one period; GNSS/global odom stamps stay intact.
transform_time_offset: 0.05
map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: map
print_diagnostics: true
# Only fused local body motion, not its absolute LIO pose or raw wheel again.
odom0: /geographic/motion
odom0_config: [false, false, false, false, false, false, true, true, false, false, false, true, false, false, false]
odom0_differential: false
odom0_relative: false
odom0_queue_size: 20
# Already WGS84 local ENU, base reference, compensated exactly once.
odom1: /gnss/odometry
odom1_config: [true, true, false, false, false, false, false, false, false, false, false, false, false, false, false]
odom1_differential: false
odom1_relative: false
odom1_queue_size: 10
odom1_pose_rejection_threshold: 5.0
