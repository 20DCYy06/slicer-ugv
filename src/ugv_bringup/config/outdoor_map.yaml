# The global obstacle cache rolls around the robot in the ENU map frame.
global_costmap:
  global_frame: map
  rolling_window: true
  static_map: false
  width: 60.0
  height: 60.0
  resolution: 0.10
  update_frequency: 2.5
  plugins:
    - {name: obstacle_layer, type: 'costmap_2d::ObstacleLayer'}
    - {name: inflation_layer, type: 'costmap_2d::InflationLayer'}
  obstacle_layer:
    scan:
      obstacle_range: 16.0
      raytrace_range: 20.0
  inflation_layer:
    inflation_radius: 0.45
local_costmap:
  global_frame: odom
  rolling_window: true
  track_unknown_space: true
  always_send_full_costmap: true
# A global route may cross unknown cells; local unknown-space and Guard rules
# remain at their existing settings and still require live lidar observations.
GlobalPlanner:
  allow_unknown: true
  task_side_hysteresis: true
DWAPlannerROS:
  start_commitment: true
  xy_goal_tolerance: 0.20
  yaw_goal_tolerance: 0.30
  min_vel_x: 0.0  # Forward-only Guard requires zero for stops and in-place turns.
  min_vel_trans: 0.08
  min_vel_theta: 0.25
