# Geographic map uses a fixed ENU obstacle cache. Rebuild navigation while
# parked after an origin/registration change. Coverage is separate from
# observed free space and from the site's permitted driving area.
global_costmap:
  global_frame: map
  rolling_window: false
  static_map: false
  width: 90.0
  height: 90.0
  origin_x: -45.0
  origin_y: -45.0
  resolution: 0.05
  plugins:
    - {name: obstacle_layer, type: 'costmap_2d::ObstacleLayer'}
    - {name: inflation_layer, type: 'costmap_2d::InflationLayer'}
local_costmap:
  global_frame: odom
  rolling_window: true
  track_unknown_space: true
  always_send_full_costmap: true
# A global route may cross unknown cells; local unknown-space and Guard rules
# remain at their existing settings and still require live lidar observations.
GlobalPlanner:
  allow_unknown: true
DWAPlannerROS:
  xy_goal_tolerance: 0.10
  yaw_goal_tolerance: 0.12
