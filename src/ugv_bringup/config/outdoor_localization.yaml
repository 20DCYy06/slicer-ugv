# 接收/天线/原点仍在现有slicer_gnss.yaml和gnss_site.yaml，不复制尺寸。
gnss_position_std_m: 0.5     # 接收机covariance UNKNOWN时的保守假设，不是实测精度。
min_alignment_displacement_m: 0.75  # 拒绝静止抖动/不足位移，不是自动运动距离。
max_alignment_residual_m: 0.5
max_fix_age_s: 2.5          # 沿用接收链预算，同stamp质量消息必须同时存在。
max_odom_gap_s: 0.5         # 只在有前后样本时插值，不外推。
max_gnss_innovation_m: 3.0 # 大恢复跳变暂停纠偏、保留原点，人工检查/重新配准。
arrival_tolerance_m: 0.20  # 原始RTK估计残差复核；不替代尺测真值。
status_max_age_s: 1.0
stop_window_s: 1.0

# Automatic fitting uses distinct positions and independent heading evidence.
# The 1.2 m baseline is a geometry gate, separate from the motion budget.
automatic_registration:
  min_baseline_m: 1.2
  spacing_m: 0.20
  min_samples: 6
  max_gap_s: 1.5               # Do not join across an ordinary loss of paired data.
  max_residual_m: 0.15
  max_heading_std_rad: 0.11    # Heuristic seed uncertainty, about 6.3 degrees.
  max_heading_delta_rad: 0.10  # Agreement of overlapping trajectory fits.
  resume_odom_m: 0.10          # Coincident stop/resume anchors, in both frames.
  resume_enu_m: 0.20
