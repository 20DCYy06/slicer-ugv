# RTK field DWA limits in m/s and rad/s. The angular limit is 45 degrees/s.
DWAPlannerROS:
  max_vel_x: 0.8
  max_vel_trans: 0.8
  max_vel_theta: 0.7853981633974483
  # Ramp toward cruise speed within the Guard braking checks.
  acc_lim_x: 0.5
  acc_lim_trans: 0.5
  # Favor the planned bypass over cutting back toward the final goal at a wall.
  path_distance_bias: 2.4
  # Finer forward sampling within the existing acceleration window.
  vx_samples: 9
  # Favor progress on valid trajectories and sample zero angular speed as well.
  goal_distance_bias: 1.4
  vth_samples: 21
