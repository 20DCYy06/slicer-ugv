# Physical limits/footprint are generated, not duplicated here.
TebLocalPlannerROS:
  teb_autosize: true
  dt_ref: 0.3
  dt_hysteresis: 0.1
  min_samples: 3
  max_samples: 60
  weight_kinematics_nh: 1000.0
  weight_kinematics_turning_radius: 1.0  # min_turning_radius remains 0: no finite-radius restriction.
  weight_max_vel_theta: 1.0
  weight_acc_lim_theta: 1.0
  allow_init_with_backwards_motion: false  # Prefer a forward-seeded turn, not a reverse-seeded band.
  global_plan_overwrite_orientation: true
  max_global_plan_lookahead_dist: 1.5
  exact_arc_length: true
  force_reinit_new_goal_dist: 1.0
  force_reinit_new_goal_angular: 0.52
  free_goal_vel: false
  complete_global_plan: true
  # Bound controller work on Jetson. GlobalPlanner supplies the obstacle detour;
  # optimize one local band instead of rebuilding multiple homotopy graphs.
  enable_homotopy_class_planning: false
  enable_multithreading: false
  publish_feedback: false
  visualize_hc_graph: false
  max_number_classes: 2
  no_inner_iterations: 3
  no_outer_iterations: 3
  feasibility_check_no_poses: 3
  min_resolution_collision_check_angular: 0.15
  global_plan_viapoint_sep: 0.5
  weight_viapoint: 0.30
  weight_optimaltime: 1.5
  penalty_epsilon: 0.01
  weight_shortest_path: 0.2
  weight_obstacle: 60.0
  inflation_dist: 0.25
  weight_inflation: 0.2
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0
  obstacle_poses_affected: 15
  selection_prefer_initial_plan: 0.95
  shrink_horizon_backup: true
  oscillation_recovery: true
  oscillation_v_eps: 0.1
  oscillation_omega_eps: 0.1
