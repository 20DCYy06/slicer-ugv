name: Native Noetic preflight

on:
  pull_request:
  push:
    branches: [main, migration/native-noetic, refactor/ros-layout]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install source-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-catkin-pkg python3-yaml
      - name: Check native workspace preparation
        run: |
          bash -n tools/build_native.sh
          bash -n tools/check_native.sh
          bash -n tools/no_rtk.sh
          bash tools/check_native.sh --static
